<script id="csmouseup" type="text/x-cindyscript">
if(TT==[],,NewStart=true;Start=parse(sum(TT)));

Pt.x=Pt.x+Chge;FV=FV-Chge/Len;Chge=0;V=FV+DV;
Pt.selected=false;






;

<script id="csdraw" type="text/x-cindyscript">
ButZoomIn.xy=ButPt.xy+[.5,0];
ButZoomOut.xy=ButPt.xy+[.5,-1.5];
ButActual.xy=ButZoomOut.xy+[0,-1.5];

ButStepLt.xy=ButActual.xy+[-1,-3];
ButStepRt.xy=ButStepLt.xy+[3,0];

ButNearest.xy=ButPt.xy+[0,-10];

forall(1..NZ,k,element("U"+k).y=element("Or"+k).y;element("U"+k).x=U1.x);
Len=U1.x-Or1.x;
Int=Len/10;

//V= value chosen; FV = integer part floor(V);DV=decimal part = V-FV

//step point by size of current zoom depth
if(ButStepRt.pressed,ButStepRt.pressed=false;Pt.x=Pt.x+10^(-NZ+1)*Int;if(Pt.x>U1.x,Pt.x=Pt.x-Len;FV=FV+1));
if(ButStepLt.pressed,ButStepLt.pressed=false;Pt.x=Pt.x-10^(-NZ+1)*Int;if(Pt.x<Or1.x,Pt.x=Pt.x+Len;FV=FV-1));

//set initial number
if(NewStart,V=Start;NewStart=false;FV=floor(V);DV=V-FV;Pt.x=Or1.x+DV*Len,DV=(Pt.x-Or1.x)/Len;V=FV+DV);

//decide zoom depth
AllDPs=DecDigs(DV,5);

if(ButZoomOut.pressed,ButZoomOut.pressed=false;NZ=NZ-1;if(NZ<1,NZ=1)
 //,layer(-1);clrscr();layer(0)
);

VDPs=prepend(FV,DecDigs(DV,NZ));

//round to nearest zoom-decimal place
if(ButNearest.pressed,ButNearest.pressed=false;VS=V*10^NZ;FVS=Floor(VS);VV=VS-FVS;if(VV>=.5,VVV=(FVS+1)/10^(NZ),VVV=FVS/10^NZ);FVVV=floor(VVV);DVVV=VVV-FVVV;V=VVV;DV=DVVV;FV=FVVV;Pt.x=Or1.x+DV*Len);

if(ButActual.pressed,;drawtext(Pt.xy+[-.4,1.5],V,color->[1,0,0],size->18));

//draw ticks
//layer(-2);clrscr();
Ticks(NZ);
Points(NZ);
Scalings(NZ);
//make visible
forall(1..4,k,forall([element("Or"+k),element("U"+k),element("NLine"+k)],#.visible=k<=NZ));


if(ButZoomIn.pressed,ButZoomIn.pressed=false;
NZ=NZ+1;if(NZ>4,NZ=4,
RatTail=apply(NZ..4,d,AllDPs_d);
rat=DecApprox(RatTail,length(RatTail));
LtZ=apply(1..NZ,k,10*DecApprox(VDPs,k));
RtZ=apply(1..NZ,k,LtZ_k+10^(-k));
if(NZ==1,LtP=[floor(rat*10)/10];RtP=[LtP_1+.1],LtP=apply(1..NZ-1,k,(LtZ_(k+1)-LtZ_k)*10^(k-1));
RtP=apply(1..NZ-1,k,LtP_k+.1));
//layer(-3);
NumbLine(element("Or"+(NZ-1)).xy+[LtP_(NZ-1)*Len,0],element("Or"+(NZ-1)).xy+[RtP_(NZ-1)*Len,0],[]);
wait(1000);
ZoomIn(element("Or"+(NZ-1)).xy+[LtP_(NZ-1)*Len,0],element("Or"+NZ).xy,element("Or"+(NZ-1)).xy+[RtP_(NZ-1)*Len,0],element("U"+NZ).xy,rat));
//layer(-3);clrscr();
NumbLine(element("Or"+NZ).xy,element("U"+NZ).xy,[]);
//layer(0);
);
//layer(-2);
Ticks(NZ);Points(NZ);
Scalings(NZ);
//layer(0);




;//testing






;
</script>

;
</script>
<script id="csmousedrag" type="text/x-cindyscript">

if(Pt.x>U1.x,Chge=-Len,
if(Pt.x<Or1.x,Chge=Len)));
;
</script>
<script id="csinit" type="text/x-cindyscript">

//Decimal Digits
DecDigs(DV,DPs):=(regional(PtDPs,CurDV);CurDV=DV;PtDPs=[];forall(1..DPs,d,CurDV=CurDV*10;PtDPs=append(PtDPs,floor(CurDV));CurDV=CurDV-floor(CurDV));PtDPs);

DecApprox(DPs,d):=(regional(S);S=0;forall(1..d,S=S+DPs_#/10^(#));S);

Ticks(NZ):=forall(1..NZ,k,Label=10*DecApprox(VDPs,k);forall(1..9,j,X=element("Or"+k).x+Int*j;Y=element("Or"+k).y;draw([[X,Y-Vert],[X,Y+Vert]]);drawtext([X-.3,Y+Vert+.2],Label+j/10^(k)));drawtext(element("Or"+k).xy+[-.3,Vert+.2],Label,size->18);drawtext(element("U"+k).xy+[-.3,.2+Vert],Label+10^(-k+1),size->18));

Points(NZ):=forall(2..NZ,k,
draw(element("Or"+k).xy+[(V-10*DecApprox(VDPs,k))*Len*10^(k-1),0],color->[1,0,0],size->4));

Scalings(NZ):=(
LtZ=apply(1..NZ,k,10*DecApprox(VDPs,k));
RtZ=apply(1..NZ,k,LtZ_k+10^(-k));
LtP=apply(1..NZ-1,k,(LtZ_(k+1)-LtZ_k)*10^(k-1));
RtP=apply(1..NZ-1,k,LtP_k+.1);
forall(1..NZ-1,k,drawall([[element("Or"+k).xy+[LtP_k*Len,0],element("Or"+(k+1)).xy],[element("Or"+k).xy+[RtP_k*Len,0],element("U"+(k+1)).xy]],dashtype->2,color->[0,0,0]));
);

NumbLine(F,B,Rat):=(
draw([F.xy,B.xy],color->[0,0,0]);
draw(F.xy+Rat*(B.xy-F.xy),size->3,color->[1,0,0]);
forall(0..10,k,X=F.xy+[k*(B.x-F.x)/10,0];draw([X+[0,-Vert],X+[0,Vert]]))
);
//ZoomIn uses Pt position and current DecimalPlace
ZoomIn(LtS,LtF,RtS,RtF,Rat):=(NFrames=20;layer(-1);
forall(1..NFrames-1,nf,Lmu=nf/NFrames;Rmu=nf/NFrames;clrscr();NumbLine(LtS+Lmu*(LtF-LtS),RtS+Rmu*(RtF-RtS),Rat)
;drawall([[LtS+Lmu*(LtF-LtS),LtS],[RtS+Rmu*(RtF-RtS),RtS]],dashtype->1,color->[0,0,0]);
wait(200));clrscr();layer(0);
);





;NZ=1;del=5;
Or1.xy=[-3,7];
U1.x=27;
Vert=.4;
V=5.2956;
FV=floor(V);DV=V-FV;
Pt.x=Or1.x+DV*(U1.x-Or1.x);
//Layer -1 is for animation of zoom
//Layer -2 is for
//layer -3 is for 
//autoclearlayer(-1,false);
//autoclearlayer(-2,false);
//autoclearlayer(-3,false);
NewStart=false;
Adj=[-.3,.2];
ButStart.xy=Or1.xy+[-.2,.2+Vert];
forall(2..4,k,element("Or"+k).xy=Or1.xy+[0,-del*(k-1)];element("U"+k).xy=U1.xy+[0,-(k-1)*del]);
Refine=false;




;
</script>
